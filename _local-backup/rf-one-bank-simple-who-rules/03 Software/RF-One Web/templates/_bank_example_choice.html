<dialog id="bank-example-choice" aria-labelledby="bank-example-title">
  <div class="bank-example-heading"><h3 id="bank-example-title">Use as example</h3><button type="button" class="btn-secondary" id="bank-example-close" aria-label="Close">×</button></div>
  <p id="bank-example-description"></p>
  <div class="bank-example-options"><a class="btn-secondary" id="bank-example-rule">AI rule</a><small>Extract WHO from the description.</small><a class="btn-secondary" id="bank-example-photo">Recognition profile</a><small>Choose WHY and WHOM.</small></div>
</dialog>
<style>
 .bank-manual-choice{white-space:nowrap!important;width:auto!important;min-width:7rem}td[data-label="WHO / WHY"]{min-width:8rem}
 .bank-example-open{display:inline-flex!important;align-items:center;justify-content:center;white-space:nowrap;width:auto!important;padding:.45rem .7rem!important;line-height:1.3!important;box-sizing:border-box}
 .bank-example-cell{min-width:11rem}.bank-example-cell .bank-pipeline-status{white-space:normal}
 #bank-example-choice{width:min(440px,calc(100% - 40px));box-sizing:border-box;max-height:85vh;overflow:auto;border:1px solid #dce0cc;border-radius:12px;padding:24px}
 #bank-example-choice::backdrop{background:rgba(0,0,0,.25)}.bank-example-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.bank-example-heading h3{margin:0}.bank-example-heading button{width:auto}
 #bank-example-description{overflow-wrap:anywhere}.bank-example-options{display:grid;gap:8px}.bank-example-options a{display:block;text-align:center;text-decoration:none;padding:12px 16px;border-radius:6px;line-height:1.35;font-weight:600}.bank-example-options small{margin-bottom:12px;color:#6e735e}
</style>
<script defer src="{{ url_for('static',filename='js/bank-example-choice.js') }}?v=en1"></script>
