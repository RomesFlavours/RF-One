<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RF-One · Procedures e MyRF</title>
<style>
:root{font-family:system-ui,sans-serif;color:#203c38;background:#f3f5f1}*{box-sizing:border-box}body{margin:0}header{background:#173e37;color:white;padding:24px 5%;display:flex;justify-content:space-between;gap:22px;align-items:center}h1{font-size:23px;margin:4px 0}header small{color:#b9d5c5}select,input,textarea,button{font:inherit;padding:11px;border:1px solid #b9c7be;border-radius:7px}select{display:block;margin-top:7px;max-width:100%}button{background:#1b6050;color:white;cursor:pointer;border:0}button:hover{background:#114637}button:disabled{opacity:.5}nav{padding:18px 5%;display:flex;gap:12px;border-bottom:1px solid #d6ded7}nav button{background:transparent;color:#254b41}nav button.active{background:#dce9df}main{max-width:1180px;margin:26px auto;padding:0 24px}h2{font-size:26px}h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{background:white;border:1px solid #dce3da;border-radius:12px;padding:24px;margin-bottom:20px}.num{font-size:40px;font-weight:650}.muted{color:#5a7065;font-size:14px}.tag{display:inline-block;background:#e7eee4;padding:5px 10px;border-radius:20px;font-size:13px}.notice{background:#fff3d9;border-left:4px solid #c89836;padding:17px;line-height:1.6}label{display:block;margin-bottom:12px}input,textarea{display:block;margin-top:7px;max-width:100%}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:12px;text-align:left;border-bottom:1px solid #e2e8df}th{color:#5a7065}section{overflow-x:auto}li{margin:12px 0;line-height:1.5}.toast{padding:13px 24px;background:#deebde;position:sticky;top:0;z-index:3}.danger{background:#fff;color:#8b352f;border:1px solid #d7b2a4}footer{padding:30px 5%;font-size:13px;color:#586d61}p{line-height:1.6}.row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}@media(max-width:650px){header{display:block}nav{flex-wrap:wrap}main{padding:0 14px}td,th{padding:8px}header label{margin-top:20px}}
</style>
<header><div><small>RF-ONE / PROTOTIPO LOCALE</small><h1>Cross-Domain Procedures</h1><span>Dal bisogno alla conferma, con evidenze.</span></div><label>Ruolo di prova<select id="role"><option value="staff">Dipendente</option><option value="foh">Responsabile FOH Winter Park</option><option value="md">Responsabile scorte Mount Dora</option><option value="control">Controllo di gestione (non assegnato)</option></select></label></header>
<div id="message" role="status" aria-live="polite"></div><nav><button data-tab="myrf" class="active">MyRF</button><button data-tab="procedures">Procedures</button><button data-tab="data">Dati operativi</button></nav><main id="content"></main><footer><div class="row"><span>Ambiente dimostrativo · Dati salvati sul computer · Nessun collegamento a RF-One</span><button class="danger" id="reset">Ripristina dati dimostrativi</button></div></footer>
<script>
let state,procedure,proposal,tab='myrf',busy=false;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=v=>new Date(v).toLocaleString('it-IT'),money=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'USD'}).format(v);
const names={requested:'In attesa di accettazione',reserved:'Riservata · da spedire',transit:'In transito',received:'Ricevuta · attende controllo',closed:'Chiusa'};
async function load(){try{let r=await fetch('/api/state');if(!r.ok)throw Error('Caricamento non riuscito');let d=await r.json();state=d.state;procedure=d.procedure;proposal=d.proposal;render()}catch(e){notify(e.message)}}
function notify(t){$('message').className='toast';$('message').textContent=t}
async function post(action,extra={}){if(busy)return;busy=true;document.querySelectorAll('main button').forEach(b=>b.disabled=true);try{let r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:$('role').value,action,requestId:crypto.randomUUID(),...extra})});let d=await r.json();notify(d.error||d.result)}catch(e){notify('Connessione locale interrotta. Ricaricare per verificare l’esito prima di riprovare.')}finally{busy=false;await load()}}
function stock(){return `<div class="grid">${Object.entries(state.stock).map(([k,s])=>`<div class="card"><h3>${k==='wp'?'Winter Park':'Mount Dora · chiusa'}</h3><div class="num">${s.available}</div><p>disponibili · ${s.reserved} riservati</p><span class="muted">Minimo ${s.min} · Massimo ${s.max??'non definito'}${k==='md'?' · Consumo previsto 0':''}</span></div>`).join('')}<div class="card"><h3>Tra le sedi</h3><div class="num">${state.transit}</div><p>in transito · esclusi dalle sedi</p><span class="muted">In ordine: ${state.onOrder} · Confezione acquisto: 24</span></div></div>`}
function cases(){return state.cases.length?state.cases.slice().reverse().map(c=>{let r=$('role').value,action=c.status==='requested'&&r==='md'?'accept':c.status==='reserved'&&r==='md'?'ship':c.status==='transit'&&r==='foh'?'receive':c.status==='received'&&r==='control'&&!c.review?'review':null;let label={accept:'Accetta e riserva '+c.qty+' bicchieri',ship:'Conferma spedizione di '+c.qty+' bicchieri',receive:'Conferma ricezione di '+c.qty+' bicchieri',review:'Registra controllo di gestione'};return `<div class="card"><div class="row"><h3>${c.id} · Trasferimento di ${c.qty} bicchieri</h3><span class="tag">${names[c.status]}</span></div><p>Mount Dora → Winter Park · Procedure ${c.procedure}, versione ${c.version}<br>Richiesta: ${date(c.requestedAt)} · Valore: ${money(c.qty*4)}</p><ul>${[['request','Richiesta FOH'],['accept','Accettazione Mount Dora'],['ship','Spedizione'],['receive','Ricezione'],['review','Controllo di gestione']].map(([k,l])=>`<li>${c.evidence[k]?'✓':'○'} ${l}${c.evidence[k]?' · '+date(c.evidence[k]):' · in attesa'}</li>`).join('')}<li>${state.intercompany.some(i=>i.caseId===c.id)?'✓':'○'} Registrazione intercompany locale</li><li>${state.stock.wp.available>=60&&state.stock.wp.available<=120?'✓':'○'} Winter Park tra minimo e massimo</li></ul>${action?`<button data-action="${action}" data-case="${c.id}">${label[action]}</button>`:`<p class="muted">${c.status==='closed'?'Tutte le evidenze richieste sono presenti.': 'Il prossimo passaggio compete a '+(c.status==='requested'||c.status==='reserved'?'Mount Dora':c.status==='transit'?'FOH Winter Park':'Controllo di gestione')+'.'}</p>`}${c.status==='received'?'<p class="notice">Ricezione e intercompany presenti. La 0.3 richiede anche il controllo di gestione per la chiusura. Il titolare organizzativo resta da assegnare.</p>':''}</div>`}).join(''):'<div class="card"><p>Nessuna pratica aperta. Le pratiche nascono dalla conferma FOH, non dalla sola proposta.</p></div>'}
function render(){let r=$('role').value;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab==='myrf'){
html=`<h2>MyRF <span class="muted">/ ${esc($('role').selectedOptions[0].text)}</span></h2>`;
if(r==='staff')html+=`<div class="card"><span class="tag">WINTER PARK · BICCHIERI VINO</span><h2>Registra una rottura</h2><p>Disponibili: <strong>${state.stock.wp.available}</strong>. La registrazione aggiorna subito la scorta.</p><form id="breakForm"><label>Quantità rotta<input id="qty" type="number" min="1" max="${state.stock.wp.available}" step="1" value="22" required></label><label>Nota facoltativa<textarea id="note" placeholder="Che cosa è successo?"></textarea></label><button>Registra rottura</button></form></div>`;
else{html+=stock();if(r==='foh')html+=proposal&&!state.cases.some(c=>c.status!=='closed')?`<div class="card"><span class="tag">BISOGNO DI RIASSORTIMENTO</span><h2>Trasferisci ${proposal} bicchieri da Mount Dora</h2><p>Winter Park: ${state.stock.wp.available} disponibili, minimo 60.<br>Fabbisogno: 120 − ${state.stock.wp.available} − ${state.onOrder} in ordine = ${120-state.stock.wp.available-state.onOrder}.<br>Mount Dora può cedere ${state.stock.md.available}: minimo e consumo previsto sono 0.<br>Acquisto proposto: 0 · Valore dimostrativo: ${money(proposal*4)}.</p><button data-action="request">Conferma richiesta di trasferimento</button><p class="muted">Nessuna quantità sarà riservata prima dell’accettazione dell’altra sede.</p></div>`:`<div class="card">${state.cases.some(c=>c.status!=='closed')?'Riassortimento già in corso: segui la pratica qui sotto.':'Nessuna nuova azione di riassortimento richiesta.'}</div>`;html+='<h2>Pratiche e prossime azioni</h2>'+cases();}
}else if(tab==='procedures'){html=`<h2>Procedures</h2><div class="card"><span class="tag">DEFINIZIONE · VERSIONE ${procedure.version} · BOZZA</span><h2>001 · Scorte e vetreria FOH</h2><p>Disponibilità per il servizio senza eccesso di scorte. Ambito del prototipo: Winter Park; Mount Dora chiusa come sede cedente.</p><p>Contenuto: responsabile FOH · Manutenzione RF-One: Anthony · Approvazione prevista: Pino. Questa demo non rappresenta un’approvazione della bozza.</p><ol>${procedure.steps.map(s=>`<li>${s}</li>`).join('')}</ol><h3>Ruoli e autorità</h3><p>Dipendente: registra rotture. FOH Winter Park: conferma richieste e ricezioni. Responsabile scorte Mount Dora: accetta e spedisce. Controllo di gestione: registra la verifica finale; nessuna persona assegnata nella demo.</p><h3>Regole applicate</h3><p>Attivazione: disponibilità ≤ minimo. Fabbisogno = massimo − disponibile − in ordine − trasferimenti già in corso. Cedibile = disponibile dell’altra sede − minimo − consumo previsto (0 a Mount Dora chiusa). Nessuna azione di trasferimento viene confermata dal sistema.</p><p>Ogni pratica conserva il riferimento alla versione 0.3. Le conferme richiedono un’azione esplicita; ricezione e intercompany sono registrati nella stessa transazione.</p><div class="notice">Precedenza alla 0.3: riserva già all’accettazione; transito escluso dalle sedi. Lo scenario T12 precedente non include il controllo di gestione, richiesto invece dalla sezione 8 della 0.3. Il prototipo conserva questo requisito.</div><p class="muted">Fonti locali: modello Procedures/MyRF 0.1; Procedure 001 Draft 0.3 (16 ottobre 2026); Test Scenarios Version 1, applicati quando compatibili.</p></div><h2>Applicazioni concrete della procedura</h2>${cases()}`;
}else{html=`<h2>Dati operativi</h2><p>Bicchieri vino · Valore intercompany dimostrativo: ${money(4)} per bicchiere</p>${stock()}<section class="card"><h3>Storico movimenti · saldi dopo l’azione</h3><table><thead><tr><th>Data / ruolo</th><th>Movimento</th><th>WP disponibili</th><th>MD disponibili</th><th>MD riservati</th><th>In transito</th></tr></thead><tbody>${state.movements.slice().reverse().map(m=>`<tr><td>${date(m.date)}<br>${esc(m.role)}</td><td>${esc(m.type)}</td><td>${m.wp}</td><td>${m.md}</td><td>${m.reserved}</td><td>${m.transit}</td></tr>`).join('')}</tbody></table></section><section class="card"><h3>Registrazioni intercompany locali</h3>${state.intercompany.length?state.intercompany.map(i=>`<p><strong>${i.id} · ${money(i.value)}</strong><br>${i.from} → ${i.to} · ${i.qty} × ${money(i.unitValue)}<br>${date(i.date)} · ${i.role} · Pratica ${i.caseId}</p>`).join(''):'<p>Nessuna registrazione. Verrà generata alla ricezione confermata.</p>'}<p class="muted">Registri dimostrativi; nessuna contabilizzazione o liquidazione esterna.</p></section><section class="card"><h3>Registro azioni</h3><table><thead><tr><th>Data</th><th>Ruolo</th><th>Risultato</th></tr></thead><tbody>${state.audit.slice().reverse().map(a=>`<tr><td>${date(a.date)}</td><td>${esc(a.role)}</td><td>${esc(a.result)}</td></tr>`).join('')}</tbody></table></section>`} $('content').innerHTML=html;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>post(b.dataset.action,{caseId:b.dataset.case}));if($('breakForm'))$('breakForm').onsubmit=e=>{e.preventDefault();post('break',{qty:Number($('qty').value),note:$('note').value})}}
$('role').onchange=()=>{tab='myrf';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('reset').onclick=async()=>{if(busy||!confirm('Ripristinare 80 bicchieri a Winter Park e 400 a Mount Dora? Pratiche e storico dimostrativi saranno cancellati.'))return;try{let r=await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});let d=await r.json();notify(d.result||d.error);await load()}catch(e){notify('Ripristino non riuscito: verificare il server locale.')}};load();
</script></html>
