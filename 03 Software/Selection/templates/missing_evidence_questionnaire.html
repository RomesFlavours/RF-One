<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A few more questions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 1.2rem; font-weight: 600; font-size: .95rem; }
  textarea, input[type=text] { width: 100%; padding: .5rem; margin-top: .3rem; border: 1px solid #ccc; border-radius: 4px; font-size: .95rem; box-sizing: border-box; }
  button { margin-top: 1.5rem; padding: .7rem 1.5rem; font-size: 1rem; border: none; border-radius: 4px; background: #2a5; color: white; cursor: pointer; }
</style>
</head>
<body>

<h1>Thank you for your application</h1>
<p>There are a few things we could not determine from your application. Could you please answer the questions below?</p>

<form method="post">
  {% for q in questions %}
  <label>{{ q.question_text }}
    <textarea name="answer_{{ q.id }}"></textarea>
  </label>
  {% endfor %}
  <button type="submit">Submit</button>
</form>

</body>
</html>
