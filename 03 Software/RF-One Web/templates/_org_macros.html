{% macro scope_type_options(scope_kinds) %}
  {% for k in scope_kinds %}<option value="{{ k }}">{{ k }}</option>{% endfor %}
{% endmacro %}

{% macro scope_field(scope_kinds, restaurants, legal_entities, phases) %}
<div class="scope-field field-row">
  <label>Scope type</label>
  <select name="scope_type" required>{{ scope_type_options(scope_kinds) }}</select>

  <div data-scope-value-for="RESTAURANT" hidden>
    <label>Restaurant</label>
    <select name="scope_id">
      {% for r in restaurants %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}
    </select>
  </div>
  <div data-scope-value-for="LEGAL_ENTITY" hidden>
    <label>Legal Entity</label>
    <select name="scope_id">
      {% for le in legal_entities %}<option value="{{ le.id }}">{{ le.legal_name }}</option>{% endfor %}
    </select>
  </div>
  <div data-scope-value-for="PROCESS_PHASE" hidden>
    <label>Process Phase</label>
    <select name="scope_key">
      {% for ph in phases %}<option value="{{ ph }}">{{ ph }}</option>{% endfor %}
    </select>
  </div>
  <div data-scope-value-for="GENERIC_ID" hidden>
    <label>Reference id (Corporate/Brand/Operational Unit/Operational Area — no dedicated table yet)</label>
    <input type="number" name="scope_id" placeholder="numeric id">
  </div>
  <div data-scope-value-for="GENERIC_KEY" hidden>
    <label>Reference key (Domain/Module/Process name)</label>
    <input type="text" name="scope_key" placeholder="e.g. Tips">
  </div>
  <div data-scope-value-for="NONE" hidden></div>
</div>
<script src="{{ url_for('static', filename='js/org-scope-field.js') }}"></script>
{% endmacro %}
