{% extends 'training_workspace/_base.html' %}
{% block title %}Student sign-in · Training{% endblock %}
{% block main %}<div class="tw-access"><h1>Sign in to Training</h1><p>Use your RF-One account. If you received an invitation, activate it before signing in.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></div><p><a href="{{ url_for('tw_account',mode='activate') }}">Activate account and verify email</a> · <a href="{{ url_for('tw_account',mode='recover') }}">Forgot password</a></p>{% endblock %}
