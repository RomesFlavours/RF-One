{% extends 'training_workspace/_base.html' %}
{% block title %}Primo accesso · Training{% endblock %}
{% block main %}<div class="tw-access"><h1>Scegli le tue credenziali</h1><p>Puoi modificare il nome utente. Prima di iniziare, sostituisci la password iniziale con una password personale di almeno 8 caratteri.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome utente<input name="username" required maxlength="64" value="{{ request.form.get('username',username) }}" autocomplete="username"></label><label>Nuova password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Conferma password<input name="password_confirm" type="password" required minlength="8" autocomplete="new-password"></label><button>Salva e continua</button></form><form method="post" action="{{ url_for('tw_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">Esci</button></form></div>{% endblock %}
