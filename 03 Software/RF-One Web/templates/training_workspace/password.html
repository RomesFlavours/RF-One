{% extends 'training_workspace/_base.html' %}
{% block title %}First sign-in · Training{% endblock %}
{% block main %}<div class="tw-access"><h1>Choose your credentials</h1><p>You may change your username. Before starting, replace the initial password with a personal password containing at least 8 characters.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" required maxlength="64" value="{{ request.form.get('username',username) }}" autocomplete="username"></label><label>New password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirm password<input name="password_confirm" type="password" required minlength="8" autocomplete="new-password"></label><button>Save and continue</button></form><form method="post" action="{{ url_for('tw_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">Log out</button></form></div>{% endblock %}
