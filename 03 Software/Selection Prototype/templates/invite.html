{% extends "base.html" %}
{% block title %}Imposta la password{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:2.5rem auto;">
  <h1>Benvenuto, {{ account.display_name }}</h1>
  <p class="muted small">Nome utente: <b>{{ account.username }}</b>. Scegli la tua password per accedere a Selection AI.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Password{% if min_password %} (almeno {{ min_password }} caratteri){% endif %}</label><input type="password" name="password" required>
    <label>Ripeti la password</label><input type="password" name="password2" required>
    <p><button class="btn">Imposta password</button></p>
  </form>
</div>
{% endblock %}
