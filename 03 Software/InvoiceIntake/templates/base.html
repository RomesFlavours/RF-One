<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>RF-One · Invoice Intake</title>
<style>
  :root {
    --ink: #1c1c1c;
    --paper: #faf9f7;
    --line: #ddd8d0;
    --accent: #8a3b2e;
    --muted: #7a756c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 2rem;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; font-size: .9rem; }
  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.5rem;
  }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .2rem; margin-top: .8rem; }
  input[type=text], input[type=file], select {
    width: 100%;
    padding: .5rem .6rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: .95rem;
  }
  table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  th { text-align: left; font-size: .75rem; color: var(--muted); padding: .3rem; }
  td { padding: .2rem; }
  td input { padding: .35rem .4rem; font-size: .85rem; }
  button, .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: .6rem 1.2rem;
    border-radius: 6px;
    font-size: .95rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  button.secondary, .btn.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .row { display: flex; gap: 1rem; }
  .row > div { flex: 1; }
  .hint { font-size: .8rem; color: var(--muted); margin-top: .3rem; }
  .error { background: #fbeaea; border: 1px solid #e2a8a0; color: #7a2b21; padding: .6rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  pre.raw { max-height: 220px; overflow: auto; background: #f2f0ec; padding: .8rem; border-radius: 6px; font-size: .75rem; }
  .actions { margin-top: 1.5rem; display: flex; gap: .8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RF-One · Invoice Intake (prototipo)</h1>
  <p class="subtitle">Carica una fattura, controlla/correggi i dati letti, salva su Excel.</p>
  {% block content %}{% endblock %}
</div>
</body>
</html>
