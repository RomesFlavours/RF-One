<dialog id="action-run-history" class="resume-data-dialog" aria-labelledby="action-run-history-title"><header class="resume-data-header"><h2 id="action-run-history-title">Storico azioni del candidato</h2><button type="button" onclick="this.closest('dialog').close()" aria-label="Chiudi storico azioni">×</button></header><div class="resume-data-help-bar"><a href="#selection-page-help" onclick="document.getElementById('selection-page-help').showModal();return false">Come funziona questa pagina</a></div><div id="action-run-content"></div></dialog>
<script>(()=>{const dialog=document.getElementById('action-run-history'),box=document.getElementById('action-run-content');let origin=null;document.querySelectorAll('[data-action-history]').forEach(link=>link.onclick=async e=>{e.preventDefault();origin=link;box.textContent='Caricamento…';dialog.showModal();try{const response=await fetch(link.href);if(!response.ok||response.redirected)throw Error('Storico non disponibile.');const data=await response.json();box.replaceChildren();if(!data.runs.length)box.textContent='Nessuna azione avviata.';data.runs.forEach(run=>{const section=document.createElement('section'),heading=document.createElement('h3'),p=document.createElement('p');heading.textContent=run.action.name+' · '+run.status;p.textContent='Azione v'+run.action.version+' · '+run.procedure.name+' v'+run.procedure.version;section.append(heading,p);run.attempts.forEach(a=>{const line=document.createElement('p');const time=a.at?new Date(a.at+'Z').toLocaleString('it-IT',{timeZone:{{ position.timezone|tojson }}}):'';line.textContent=time+' · '+a.by+' · '+a.status+(a.error?' · '+a.error:'');section.append(line);});(run.procedure.steps||[]).forEach((step,i)=>{const line=document.createElement('p'),status=run.steps[i]&&run.steps[i].status;line.textContent='Passaggio '+(i+1)+': '+(step.op==='set_status'?'Aggiornamento stato':step.op==='note'?'Nota':'Email')+' · '+({SUCCEEDED:'Completato',WAITING:'In attesa',PENDING:'Da eseguire'}[status]||status||'');section.append(line);});(run.emails||[]).forEach(mail=>{const details=document.createElement('details'),summary=document.createElement('summary'),body=document.createElement('p');summary.textContent=mail.subject+' · '+mail.recipient+' · '+mail.status;body.style.whiteSpace='pre-wrap';body.textContent=mail.body;details.append(summary,body);section.append(details);});if(run.error){const error=document.createElement('p');error.textContent=run.error;section.append(error);}box.append(section);});}catch(error){box.textContent=error.message;}});dialog.addEventListener('close',()=>origin&&origin.focus({preventScroll:true}));})();</script>
